<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Repair - Dashboard</title>

<!-- INCLUSÃO DOS SCRIPTS DO FIREBASE (Versão estável compatível com navegadores) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root {
    --primary: #ff2b2b;
    --primary-glow: rgba(255, 43, 43, 0.3);
    --bg-dark: #0a0a0c;
    --panel-bg: rgba(20, 20, 25, 0.85);
    --panel-border: rgba(255, 255, 255, 0.08);
    --input-bg: #16161c;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: 
        linear-gradient(rgba(10, 10, 12, 0.92), rgba(5, 5, 5, 0.97)),
        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop');
    background-size: cover;
    background-attachment: fixed;
    background-position: center;
    color: var(--text-main);
    font-size: 14px;
    padding-bottom: 90px;
}

/* HEADER */
header {
    padding: 20px;
    text-align: center;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border);
}
header h1 {
    color: var(--text-main);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
}
header h1 span {
    color: var(--primary);
    text-shadow: 0 0 12px var(--primary-glow);
}

/* TABS SYSTEM */
.tabs {
    display: flex;
    justify-content: center;
    background: rgba(15, 15, 20, 0.8);
    backdrop-filter: blur(5px);
    border-bottom: 2px solid #111;
    padding: 5px 10px 0 10px;
    gap: 4px;
    overflow-x: auto;
}
.tab {
    padding: 12px 20px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    border-radius: 6px 6px 0 0;
    transition: all 0.2s ease;
}
.tab:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.03);
}
.tab.active {
    background: var(--primary);
    color: #000;
    font-weight: 700;
    box-shadow: 0 -4px 12px var(--primary-glow);
}

/* CONTAINER PRINCIPAL */
.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 20px;
}

/* CONTENT BLOCKS */
.content {
    display: none;
    animation: fadeIn 0.3s ease-in-out;
}
.content.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

/* GRID DE PRODUTOS/SERVIÇOS CENTRALIZADO */
.items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    justify-content: center;
}

.item {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    padding: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    height: 60px;
}
.item:hover {
    border-color: rgba(255, 43, 43, 0.4);
    background: rgba(255, 43, 43, 0.02);
}

.item.selected {
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(255, 43, 43, 0.15) inset, 0 2px 8px rgba(0,0,0,0.4);
    background: rgba(255, 43, 43, 0.04);
}

.item label {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    width: 100%;
    height: 100%;
    font-weight: 500;
}

.item .price-tag {
    color: var(--primary);
    font-weight: 700;
    margin-left: auto;
}

/* INPUTS CUSTOMIZADOS */
input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid #4b5563;
    border-radius: 4px;
    background: var(--input-bg);
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    flex-shrink: 0;
}
input[type="checkbox"]:checked {
    background: var(--primary);
    border-color: var(--primary);
}
input[type="checkbox"]:checked::after {
    content: "✓";
    position: absolute;
    color: black;
    font-size: 13px;
    font-weight: 900;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

input[type="number"] {
    background: var(--input-bg);
    border: 1px solid #374151;
    color: white;
    padding: 6px;
    text-align: center;
    width: 65px;
    border-radius: 6px;
    font-weight: bold;
}
input[type="number"]:focus {
    border-color: var(--primary);
    outline: none;
}

/* DESIGN SELETOR DE DESCONTO */
.discount-select {
    background: #111115;
    border: 1px solid #27272a;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: border-color 0.2s;
    outline: none;
}
.discount-select:focus {
    border-color: var(--primary);
}
.discount-select option {
    background: #111115;
    color: white;
}

/* CLIENTES TAB DESIGN */
.clients-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}
.panel-left {
    flex: 2;
    min-width: 320px;
}
.panel-right {
    flex: 1;
    min-width: 300px;
}
.panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    padding: 20px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
}
.panel h3 {
    font-size: 16px;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 8px;
}

.search {
    width: 100%;
    margin-bottom: 15px;
    background: var(--input-bg);
    border: 1px solid #27272a;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
}
.search:focus { border-color: var(--primary); outline: none; }

/* RECORDE DE TABELAS */
.table-responsive {
    overflow-x: auto;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #222;
}
th {
    background: rgba(0,0,0,0.3);
    color: var(--primary);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
tr:hover td {
    background: rgba(255,255,255,0.01);
}

/* LISTA DE RANKING */
.rank-item {
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 3px solid #3b82f6;
}
.rank-item:nth-child(1) { border-left-color: #ffd700; background: linear-gradient(90deg, rgba(255,215,0,0.05), transparent); }
.rank-item:nth-child(2) { border-left-color: #94a3b8; }
.rank-item:nth-child(3) { border-left-color: #b45309; }

/* BARRA DOCK INFERIOR (FIXADA) */
.dock-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(5, 5, 7, 0.9);
    backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255, 43, 43, 0.4);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px;
    z-index: 1000;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    gap: 20px;
}

.dock-left {
    display: flex;
    align-items: center;
    gap: 25px;
    flex: 1;
}

.total-display {
    display: flex;
    flex-direction: column;
}
.total-display span {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1px;
}
#valorTotal {
    font-size: 26px;
    font-weight: 800;
    color: var(--primary);
    text-shadow: 0 0 10px var(--primary-glow);
    line-height: 1;
    margin-top: 2px;
}

.dock-inputs {
    display: flex;
    gap: 10px;
    flex: 1;
    max-width: 480px;
}
.dock-inputs input {
    flex: 1;
    background: #111115;
    border: 1px solid #27272a;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    transition: border-color 0.2s;
}
.dock-inputs input:focus {
    border-color: var(--primary);
    outline: none;
}

/* BOTÕES GERAIS */
.dock-buttons { display: flex; gap: 8px; }
.btn {
    padding: 10px 18px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
.btn:active { transform: translateY(1px); }

.btn-copy { background: #27272a; color: var(--text-main); border: 1px solid #3f3f46; }
.btn-reset { background: #3f1212; color: #fca5a5; border: 1px solid #7f1d1d; }
.btn-save { background: #22c55e; color: #052e16; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2); }

/* BOTÃO DE RESET DO HISTÓRICO */
.btn-db-clear {
    background: #3f1212; 
    color: #fca5a5; 
    border: 1px solid #7f1d1d; 
    padding: 8px 14px; 
    border-radius: 6px; 
    cursor: pointer; 
    font-weight: bold; 
    margin-top: 15px;
    width: 100%;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s;
}
.btn-db-clear:hover {
    background: #7f1d1d;
    color: white;
}

</style>
</head>

<body>

<header>
    <h1>🚗 AUTO <span>REPAIR</span></h1>
</header>

<div class="tabs">
    <button class="tab active" onclick="openTab('nitro',this)">Nitro</button>
    <button class="tab" onclick="openTab('stage',this)">Stage</button>
    <button class="tab" onclick="openTab('reparo',this)">Reparos</button>
    <button class="tab" onclick="openTab('lockpick',this)">Lockpick</button>
    <button class="tab" onclick="openTab('guincho',this)">Guincho</button>
    <button class="tab" onclick="openTab('clientes',this)">Clientes</button>
</div>

<div class="container">

    <!-- ===================== NITRO ===================== -->
    <div id="nitro" class="content active">
        <div class="items-grid">
            <div class="item"><label><input type="checkbox" value="5625" onchange="calcular()"> <span>Nitro Pequena</span> <span class="price-tag">$5.625</span></label></div>
            <div class="item"><label><input type="checkbox" value="20000" onchange="calcular()"> <span>Nitro Grande</span> <span class="price-tag">$20.000</span></label></div>
            <div class="item"><label><input type="checkbox" value="625" onchange="calcular()"> <span>Refil Nitro</span> <span class="price-tag">$625</span></label></div>
        </div>
    </div>

    <!-- ===================== STAGE ===================== -->
    <div id="stage" class="content">
        <div class="items-grid">
            <div class="item"><label><input type="checkbox" value="7500" onchange="calcular()"> <span>ECU (STAGE 1)</span> <span class="price-tag">$7.500</span></label></div>
            <div class="item"><label><input type="checkbox" value="13750" onchange="calcular()"> <span>Kit Freio (STAGE 2)</span> <span class="price-tag">$13.750</span></label></div>
            <div class="item"><label><input type="checkbox" value="9400" onchange="calcular()"> <span>Filtro de Ar (STAGE 2)</span> <span class="price-tag">$9.400</span></label></div>
            <div class="item"><label><input type="checkbox" value="15000" onchange="calcular()"> <span>Escape Esportivo (STAGE 2)</span> <span class="price-tag">$15.000</span></label></div>
            <div class="item"><label><input type="checkbox" value="18800" onchange="calcular()"> <span>Turbo (STAGE 3)</span> <span class="price-tag">$18.800</span></label></div>
            <div class="item"><label><input type="checkbox" value="9400" onchange="calcular()"> <span>Intercooler</span> <span class="price-tag">$9.400</span></label></div>
            <div class="item"><label><input type="checkbox" value="9400" onchange="calcular()"> <span>Suspensão 5</span> <span class="price-tag">$9.400</span></label></div>
            <div class="item"><label><input type="checkbox" value="9400" onchange="calcular()"> <span>Racing Clutch</span> <span class="price-tag">$9.400</span></label></div>
            <div class="item"><label><input type="checkbox" value="9400" onchange="calcular()"> <span>Coletor de Admissão</span> <span class="price-tag">$9.400</span></label></div>
            <div class="item"><label><input type="checkbox" value="9400" onchange="calcular()"> <span>Sistema de Combustível</span> <span class="price-tag">$9.400</span></label></div>
        </div>
    </div>

    <!-- ===================== REPAROS ===================== -->
    <div id="reparo" class="content">
        <div class="items-grid">
            <div class="item"><label><input type="checkbox" value="200" onchange="calcular()"> <span>Reparo Lataria</span> <span class="price-tag">$200</span></label></div>
            <div class="item"><label><input type="checkbox" value="700" onchange="calcular()"> <span>Reparo Motor</span> <span class="price-tag">$700</span></label></div>
            <div class="item">
                <label><span>Reparo Stage</span> <span class="price-tag">$750</span></label>
                <input type="number" value="0" min="0" data-price="750" oninput="calcular()">
            </div>
            <div class="item">
                <label><span>Tirar Peça Stage</span> <span class="price-tag">$150</span></label>
                <input type="number" value="0" min="0" data-price="150" oninput="calcular()">
            </div>
            <div class="item">
                <label><span>Colocar Peça Stage</span> <span class="price-tag">$150</span></label>
                <input type="number" value="0" min="0" data-price="150" oninput="calcular()">
            </div>
            <div class="item">
                <label><span>Pneu</span> <span class="price-tag">$125</span></label>
                <input type="number" value="0" min="0" data-price="125" oninput="calcular()">
            </div>
        </div>
    </div>

    <!-- ===================== LOCKPICK ===================== -->
    <div id="lockpick" class="content">
        <div class="items-grid">
            <div class="item">
                <label><span>Lockpick</span> <span class="price-tag">$250</span></label>
                <input type="number" value="0" min="0" data-price="250" oninput="calcular()">
            </div>
            <div class="item">
                <label><span>Kit Reparo</span> <span class="price-tag">$2.500</span></label>
                <input type="number" value="0" min="0" data-price="2500" oninput="calcular()">
            </div>
            <div class="item">
                <label><span>Lockpick Avançada</span> <span class="price-tag">$500</span></label>
                <input type="number" value="0" min="0" data-price="500" oninput="calcular()">
            </div>
        </div>
    </div>

    <!-- ===================== GUINCHO ===================== -->
    <div id="guincho" class="content">
        <div class="items-grid">
            <div class="item"><label><input type="checkbox" value="1500" onchange="calcular()"> <span>Los Santos</span> <span class="price-tag">$1.500</span></label></div>
            <div class="item"><label><input type="checkbox" value="500" onchange="calcular()"> <span>Sandy</span> <span class="price-tag">$500</span></label></div>
            <div class="item"><label><input type="checkbox" value="1000" onchange="calcular()"> <span>Paleto</span> <span class="price-tag">$1.000</span></label></div>
        </div>
    </div>

    <!-- ===================== CLIENTES ===================== -->
    <div id="clientes" class="content">
        <div class="clients-container">
            <!-- ESQUERDA: LISTA -->
            <div class="panel panel-left">
                <h3>Histórico de Ordens</h3>
                <input class="search" id="search" placeholder="Filtrar por nome ou passaporte..." oninput="renderClientes()">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Passaporte</th>
                                <th>Total Acumulado</th>
                                <th>Frequência</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- DIREITA: RANKING -->
            <div class="panel panel-right">
                <h3>🏆 Melhores Clientes</h3>
                <div id="ranking"></div>
                <button class="btn-db-clear" onclick="resetarHistoricoClientes()">⚠️ Zerar Banco de Dados</button>
            </div>
        </div>
    </div>

</div>

<!-- ===================== DOCK BAR INFERIOR ===================== -->
<div class="dock-bar">
    <div class="dock-left">
        <div class="total-display">
            <span>Total com Desconto</span>
            <div id="valorTotal">$0</div>
        </div>
        
        <div class="dock-inputs">
            <select id="discountRate" class="discount-select" onchange="calcular()">
                <option value="0">Sem Desconto</option>
                <option value="5">5% de Desconto</option>
                <option value="10">10% de Desconto</option>
                <option value="15">15% de Desconto</option>
            </select>
            <input id="clientName" placeholder="Nome do Cliente (Opcional)">
            <input id="clientCode" placeholder="ID / Passaporte (Obrigatório)">
        </div>
    </div>

    <div class="dock-buttons">
        <button class="btn btn-copy" onclick="copiarTotal()">Copiar Valor</button>
        <button class="btn btn-reset" onclick="resetar()">Limpar Tudo</button>
        <button class="btn btn-save" onclick="salvarOrcamento()">Salvar Registro</button>
    </div>
</div>

<script>
// CONFIGURAÇÃO DO SEU FIREBASE
const firebaseConfig = {
    databaseURL: "https://autorepair-68-default-rtdb.firebaseio.com/"
};

// Inicializa o Firebase no painel
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let valorAtualNumerico = 0;
let clients = {}; // A base de dados inicia vazia e sincroniza com a nuvem

// Escuta mudanças no banco de dados em tempo real
database.ref("clients").on("value", (snapshot) => {
    clients = snapshot.val() || {};
    renderClientes();
});

function openTab(id, el) {
    document.querySelectorAll('.content').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
}

function calcular() {
    let bruto = 0;

    document.querySelectorAll('input[type="checkbox"]').forEach(i => {
        let itemContainer = i.closest('.item');
        if (i.checked) {
            bruto += Number(i.value);
            if(itemContainer) itemContainer.classList.add('selected');
        } else {
            if(itemContainer) itemContainer.classList.remove('selected');
        }
    });

    document.querySelectorAll('input[type="number"]').forEach(i => {
        let qtd = Number(i.value);
        let itemContainer = i.closest('.item');
        
        if (qtd < 0) { i.value = 0; qtd = 0; }
        
        bruto += qtd * Number(i.dataset.price);
        
        if (qtd > 0) {
            if(itemContainer) itemContainer.classList.add('selected');
        } else {
            if(itemContainer && !itemContainer.querySelector('input[type="checkbox"]')?.checked) {
                itemContainer.classList.remove('selected');
            }
        }
    });

    let descontoPercentual = Number(document.getElementById("discountRate").value);
    let valorDescontado = bruto * (descontoPercentual / 100);
    let totalComDesconto = bruto - valorDescontado;

    valorAtualNumerico = totalComDesconto;
    document.getElementById("valorTotal").innerText = "$" + totalComDesconto.toLocaleString('pt-BR');
}

function salvarOrcamento() {
    let name = document.getElementById("clientName").value.trim();
    let code = document.getElementById("clientCode").value.trim();

    if (!code) return alert("Erro: O Passaporte/ID do cliente é obrigatório para registrar!");
    if (valorAtualNumerico === 0) return alert("Erro: Não é possível registrar uma ordem com valor zerado!");

    // Se o cliente não existir localmente, cria a estrutura inicial
    let clientData = clients[code] || { name: "Cliente Oculto", code: code, total: 0, visits: 0 };
    
    if (name) clientData.name = name;
    clientData.total += valorAtualNumerico;
    clientData.visits++;

    // Salva direto no Firebase Online
    database.ref("clients/" + code).set(clientData)
    .then(() => {
        alert(`Ordem de serviço registrada na nuvem!\nValor de $${valorAtualNumerico.toLocaleString('pt-BR')} enviado ao ID #${code}.`);
        document.getElementById("clientName").value = "";
        document.getElementById("clientCode").value = "";
        document.getElementById("discountRate").value = "0";
        resetar();
    })
    .catch((error) => {
        alert("Erro ao salvar! Certifique-se de que as regras do seu Firebase estão configuradas como públicas (.read: true, .write: true).");
        console.error(error);
    });
}

function renderClientes() {
    let search = document.getElementById("search").value?.toLowerCase() || "";
    let allClients = Object.values(clients);

    let dataFiltrada = allClients.filter(c => c.name.toLowerCase().includes(search) || String(c.code).includes(search));
    let body = document.getElementById("tableBody");
    body.innerHTML = "";

    dataFiltrada.forEach(c => {
        body.innerHTML += `
        <tr>
            <td>${c.name}</td>
            <td><strong>#${c.code}</strong></td>
            <td>$${c.total.toLocaleString('pt-BR')}</td>
            <td>${c.visits}x</td>
        </tr>
        `;
    });

    let rankingGeral = [...allClients].sort((a, b) => b.total - a.total);
    document.getElementById("ranking").innerHTML = rankingGeral.slice(0, 5).map((c, i) => {
        let medal = i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : `#${i+1} `;
        return `
        <div class="rank-item">
            <span>${medal} ${c.name} (#${c.code})</span>
            <strong>$${c.total.toLocaleString('pt-BR')}</strong>
        </div>`;
    }).join("");
}

function copiarTotal() {
    navigator.clipboard.writeText(document.getElementById("valorTotal").innerText);
    alert("Custo total copiado!");
}

function resetar() {
    document.querySelectorAll('input[type="checkbox"]').forEach(i => i.checked = false);
    document.querySelectorAll('input[type="number"]').forEach(i => i.value = 0);
    calcular();
}
