<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Repair</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial;
    background:
    linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.95)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop');
    background-size:cover;
    background-attachment:fixed;
    color:white;
    font-size:13px;
}

/* HEADER */
header{
    padding:12px;
    text-align:center;
    background:#000;
    border-bottom:2px solid #ff2b2b;
}
header h1{
    color:#ff2b2b;
    font-size:22px;
}

/* TABS */
.tabs{
    display:flex;
    overflow-x:auto;
    background:#111;
}

.tab{
    padding:10px 14px;
    border:none;
    background:#111;
    color:white;
    cursor:pointer;
    font-size:12px;
}

.tab.active{
    background:#ff2b2b;
    color:#000;
}

/* CONTENT */
.content{display:none;padding:12px;}
.content.active{display:block;}

/* ITEM */
.item{
    background:#111;
    padding:10px;
    margin-bottom:8px;
    border-left:4px solid #ff2b2b;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

input[type="number"]{
    width:55px;
    padding:5px;
    background:#222;
    border:none;
    color:white;
    text-align:center;
}

/* TOTAL FIXO */
.total-box{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#000;
    border-top:2px solid #ff2b2b;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px;
    gap:10px;
}

#valorTotal{font-size:18px;font-weight:bold;}

.buttons button{
    padding:6px 10px;
    border:none;
    cursor:pointer;
    font-size:11px;
}

.copy{background:#777;color:white;}
.reset{background:#ff2b2b;color:white;}

.client-box{
    display:flex;
    gap:5px;
    align-items:center;
}

.client-box input{
    width:90px;
    padding:5px;
    background:#222;
    border:none;
    color:white;
}

.discount{width:60px;}

</style>
</head>

<body>

<header>
<h1>🚗 AUTO REPAIR</h1>
</header>

<div class="tabs">

<button class="tab active" onclick="openTab('nitro',this)">Nitro</button>
<button class="tab" onclick="openTab('stage',this)">Stage</button>
<button class="tab" onclick="openTab('reparo',this)">Reparos</button>
<button class="tab" onclick="openTab('lockpick',this)">Lockpick</button>
<button class="tab" onclick="openTab('guincho',this)">Guincho</button>
<button class="tab" onclick="openTab('clientes',this)">Clientes</button>

</div>

<!-- NITRO -->
<div id="nitro" class="content active">

<div class="item"><label><input type="checkbox" value="5625" onchange="calcular()">Garrafa Nitro Pequena — $5.625</label></div>
<div class="item"><label><input type="checkbox" value="20000" onchange="calcular()">Garrafa Nitro Grande — $20.000</label></div>

<div class="item">
<label>Refil Nitro</label>
<input type="number" value="0" data-price="625" oninput="calcular()">
</div>

</div>

<!-- STAGE -->
<div id="stage" class="content">

<div class="item"><label><input type="checkbox" value="7500" onchange="calcular()">ECU — $7.500 (STAGE 1)</label></div>
<div class="item"><label><input type="checkbox" value="13750" onchange="calcular()">Kit Freio — $13.750 (STAGE 2)</label></div>
<div class="item"><label><input type="checkbox" value="9400" onchange="calcular()">Filtro de Ar — $9.400 (STAGE 2)</label></div>
<div class="item"><label><input type="checkbox" value="15000" onchange="calcular()">Escape Esportivo — $15.000 (STAGE 2)</label></div>
<div class="item"><label><input type="checkbox" value="18800" onchange="calcular()">Turbo — $18.800 (STAGE 3)</label></div>
<div class="item"><label><input type="checkbox" value="9400" onchange="calcular()">Intercooler — $9.400 (STAGE 3)</label></div>
<div class="item"><label><input type="checkbox" value="9400" onchange="calcular()">Suspensão 5 — $9.400 (STAGE 3)</label></div>
<div class="item"><label><input type="checkbox" value="9400" onchange="calcular()">Racing Clutch — $9.400 (STAGE 3)</label></div>
<div class="item"><label><input type="checkbox" value="9400" onchange="calcular()">Coletor de Admissão — $9.400 (STAGE 3)</label></div>
<div class="item"><label><input type="checkbox" value="9400" onchange="calcular()">Sistema de Combustível — $9.400 (STAGE 3)</label></div>

</div>

<!-- REPAROS -->
<div id="reparo" class="content">

<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo ECU — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Kit Freio — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Filtro de Ar — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Escape Esportivo — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Turbo — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Intercooler — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Suspensão 5 — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Racing Clutch — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Coletor de Admissão — $750</label></div>
<div class="item"><label><input type="checkbox" value="750" onchange="calcular()">Reparo Sistema de Combustível — $750</label></div>

<div class="item"><label><input type="checkbox" value="200" onchange="calcular()">Lataria — $200</label></div>
<div class="item"><label><input type="checkbox" value="700" onchange="calcular()">Motor — $700</label></div>

<div class="item">
<label>Pneu</label>
<input type="number" value="0" data-price="125" oninput="calcular()">
</div>

</div>

<!-- LOCKPICK -->
<div id="lockpick" class="content">

<div class="item">
<label>Lockpick</label>
<input type="number" value="0" data-price="250" oninput="calcular()">
</div>

<div class="item">
<label>Kit Reparo</label>
<input type="number" value="0" data-price="2500" oninput="calcular()">
</div>

<div class="item">
<label>Lockpick Avançada</label>
<input type="number" value="0" data-price="500" oninput="calcular()">
</div>

</div>

<!-- GUINCHO -->
<div id="guincho" class="content">

<div class="item"><label><input type="checkbox" value="1500" onchange="calcular()">Los Santos — $1.500</label></div>
<div class="item"><label><input type="checkbox" value="500" onchange="calcular()">Sandy/Grape — $500</label></div>
<div class="item"><label><input type="checkbox" value="1000" onchange="calcular()">Paleto — $1.000</label></div>

</div>

<!-- CLIENTES -->
<div id="clientes" class="content">

<div class="item">
<label>Código</label>
<input id="clientCode">
</div>

<div class="item">
<label>Nome</label>
<input id="clientName">
</div>

<button onclick="salvarCliente()" style="padding:8px;background:#ff2b2b;border:none;color:black;">
Salvar Cliente
</button>

<div id="listaClientes"></div>

</div>

<!-- TOTAL -->
<div class="total-box">

<div class="client-box">
<input id="clienteAtual" placeholder="Cod Cliente">
<input id="desconto" class="discount" placeholder="%">
</div>

<div id="valorTotal">$0</div>

<div class="buttons">
<button class="copy" onclick="copiarTotal()">Copiar</button>
<button class="reset" onclick="resetar()">Resetar</button>
<button class="reset" onclick="salvarOrcamento()">Salvar</button>
</div>

</div>

<script>

let clients = JSON.parse(localStorage.getItem("clients") || "{}");

function openTab(id,el){
document.querySelectorAll('.content').forEach(e=>e.classList.remove('active'));
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
document.getElementById(id).classList.add('active');
el.classList.add('active');
}

function calcular(){

let total = 0;

document.querySelectorAll('input[type="checkbox"]').forEach(i=>{
if(i.checked) total += Number(i.value);
});

document.querySelectorAll('input[type="number"]').forEach(i=>{
total += Number(i.value) * Number(i.dataset.price);
});

let desc = Number(document.getElementById("desconto").value || 0);
total = total - (total * desc / 100);

document.getElementById("valorTotal").innerText =
"$" + total.toLocaleString('pt-BR');
}

function salvarCliente(){

let code = document.getElementById("clientCode").value;
let name = document.getElementById("clientName").value;

if(!clients[code]){
clients[code] = {name,visits:0,total:0,history:[]};
}

localStorage.setItem("clients",JSON.stringify(clients));
renderClientes();
}

function salvarOrcamento(){

let code = document.getElementById("clienteAtual").value;
let total = document.getElementById("valorTotal").innerText;

if(!clients[code]) return alert("Cliente não encontrado");

clients[code].visits++;
clients[code].total += Number(total.replace("$","").replace(".",""));

clients[code].history.push({
date:new Date().toLocaleString(),
value:total
});

localStorage.setItem("clients",JSON.stringify(clients));

alert("Salvo!");
renderClientes();
}

function renderClientes(){

let div = document.getElementById("listaClientes");
div.innerHTML = "";

Object.keys(clients).forEach(c=>{
div.innerHTML += `
<div style="background:#111;margin-top:8px;padding:8px;">
<b>${c} - ${clients[c].name}</b><br>
Visitas: ${clients[c].visits}<br>
Total: $${clients[c].total}
</div>`;
});

}

function copiarTotal(){
navigator.clipboard.writeText(document.getElementById("valorTotal").innerText);
}

function resetar(){
document.querySelectorAll('input[type=checkbox]').forEach(i=>i.checked=false);
document.querySelectorAll('input[type=number]').forEach(i=>i.value=0);
calcular();
}

renderClientes();

</script>

</body>
</html>
