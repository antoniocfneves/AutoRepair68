<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Serviços</title>

  <style>
    body{
      font-family: Arial;
      background:#111;
      color:white;
      padding:30px;
    }

    .item{
      margin:10px 0;
      font-size:20px;
    }

    #total{
      margin-top:30px;
      font-size:30px;
      color:#00ff88;
    }
  </style>
</head>
<body>

  <h1>Calculadora de Serviços</h1>

  <div class="item">
    <input type="checkbox" value="200" onchange="somar()">
    Lataria - R$200
  </div>

  <div class="item">
    <input type="checkbox" value="700" onchange="somar()">
    Motor - R$700
  </div>

  <div class="item">
    <input type="checkbox" value="625" onchange="somar()">
    Refil Nitro - R$625
  </div>

  <div id="total">
    Total: R$0
  </div>

  <script>
    function somar(){
      let total = 0;

      document.querySelectorAll("input[type=checkbox]").forEach(item => {
        if(item.checked){
          total += Number(item.value);
        }
      });

      document.getElementById("total").innerHTML =
        "Total: R$" + total;
    }
  </script>

</body>
</html>
