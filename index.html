<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto Repair</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:
    linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.92)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;
    min-height:100vh;
}

header{
    background:rgba(0,0,0,0.9);
    padding:25px;
    text-align:center;
    border-bottom:3px solid #00ff88;
    box-shadow:0 0 20px #00ff8855;
}

header h1{
    font-size:40px;
    color:#00ff88;
    text-shadow:0 0 15px #00ff88;
}

header p{
    margin-top:10px;
    color:#aaa;
}

.tabs{
    display:flex;
    overflow-x:auto;
    background:#111;
    border-bottom:2px solid #00ff88;
}

.tab{
    flex:none;
    padding:18px 25px;
    background:#111;
    color:white;
    border:none;
    cursor:pointer;
    transition:0.3s;
    font-size:16px;
    font-weight:bold;
}

.tab:hover{
    background:#1d1d1d;
}

.tab.active{
    background:#00aa66;
    color:black;
}

.content{
    display:none;
    padding:25px;
    animation:fade 0.3s;
}

.content.active{
    display:block;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.item{
    background:rgba(20,20,20,0.92);

    border:1px solid #333;
    border-left:5px solid #00ff88;

    padding:18px;
    margin-bottom:15px;

    border-radius:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    transition:0.3s;
}

.item:hover{
    transform:scale(1.01);
    border-color:#00ff88;
    box-shadow:0 0 15px #00ff8844;
}

label{
    font-size:18px;
}

input[type="checkbox"]{
    transform:scale(1.3);
    margin-right:10px;
}

input[type="number"]{
    width:70px;
    padding:8px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    text-align:center;
    font-size:16px;
}

.total-box{

    position:fixed;

    right:20px;
    bottom:20px;

    background:#000;

    border:2px solid #00ff88;
    border-radius:20px;

    padding:20px;

    width:320px;

    box-shadow:0 0 20px #00ff8877;
}

.total-box h2{
    color:#00ff88;
    margin-bottom:10px;
}

#valorTotal{
    font-size:35px;
    font-weight:bold;
}

.buttons{
    margin-top:15px;
    display:flex;
    gap:10px;
}

.buttons button{

    flex:1;

    padding:12px;

    border:none;
    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    transition:0.3s;
}

.copy{
    background:#00aa66;
    color:black;
}

.reset{
    background:#aa2222;
    color:white;
}

.buttons button:hover{
    opacity:0.8;
}

@media(max-width:768px){

    .item{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .total-box{
        width:90%;
        left:5%;
        right:5%;
    }

}

</style>

</head>

<script>

function openTab(tabId, element){

    document.querySelectorAll('.content')
    .forEach(tab => {
        tab.classList.remove('active');
    });

    document.querySelectorAll('.tab')
    .forEach(btn => {
        btn.classList.remove('active');
    });

    document.getElementById(tabId)
    .classList.add('active');

    element.classList.add('active');
}

function calcular(){

    let total = 0;

    document.querySelectorAll('input[type="checkbox"]')
    .forEach(item => {

        if(item.checked){
            total += Number(item.value);
        }

    });

    document.querySelectorAll('input[type="number"]')
    .forEach(item => {

        total +=
        Number(item.value)
        *
        Number(item.dataset.price);

    });

    document.getElementById('valorTotal')
    .innerText =
    "$" + total.toLocaleString('pt-BR');

}

function copiarTotal(){

    let valor =
    document.getElementById('valorTotal')
    .innerText;

    navigator.clipboard.writeText(valor);

    alert("Total copiado: " + valor);

}

function resetar(){

    document.querySelectorAll('input[type="checkbox"]')
    .forEach(item => {
        item.checked = false;
    });

    document.querySelectorAll('input[type="number"]')
    .forEach(item => {
        item.value = 0;
    });

    calcular();

}

</script>
