<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Repair</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial;
    background:
    linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.95)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop');
    background-size:cover;
    background-attachment:fixed;
    color:white;
    font-size:13px;
}

/* HEADER */
header{
    padding:12px;
    text-align:center;
    background:#000;
    border-bottom:2px solid #ff2b2b;
}

header h1{color:#ff2b2b;font-size:22px;}

/* TABS */
.tabs{display:flex;overflow-x:auto;background:#111;}

.tab{
    padding:10px 14px;
    background:#111;
    border:none;
    color:white;
    cursor:pointer;
    font-size:12px;
}

.tab.active{
    background:#ff2b2b;
    color:#000;
}

/* CONTENT */
.content{display:none;padding:12px;}
.content.active{display:block;}

.item{
    background:#111;
    padding:10px;
    margin-bottom:8px;
    border-left:4px solid #ff2b2b;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

input{
    background:#222;
    border:none;
    color:white;
    padding:5px;
    text-align:center;
}

/* TOTAL FIXO */
.total-box{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#000;
    border-top:2px solid #ff2b2b;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px;
}

#valorTotal{font-size:18px;font-weight:bold;}

/* BOTÕES */
.buttons button{
    padding:6px 10px;
    border:none;
    cursor:pointer;
    font-size:11px;
}

.copy{background:#777;color:white;}
.reset{background:#ff2b2b;color:black;}

/* CLIENTE TOP */
.client-top{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.client-top input{
    flex:1;
}

/* CLIENTES AREA */
.clients-container{
    display:flex;
    gap:10px;
}

.left, .right{
    width:50%;
    background:#111;
    padding:10px;
    border-radius:8px;
}

.search{
    width:100%;
    margin-bottom:10px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th,td{
    border:1px solid #333;
    padding:6px;
}

th{
    background:#000;
    color:#ff2b2b;
}

/* RANKING */
.rank-item{
    padding:6px;
    border-bottom:1px solid #333;
    font-size:12px;
}

</style>
</head>

<body>

<header>
<h1>🚗 AUTO REPAIR</h1>
</header>

<div class="tabs">

<button class="tab active" onclick="openTab('nitro',this)">Nitro</button>
<button class="tab" onclick="openTab('stage',this)">Stage</button>
<button class="tab" onclick="openTab('reparo',this)">Reparos</button>
<button class="tab" onclick="openTab('lockpick',this)">Lockpick</button>
<button class="tab" onclick="openTab('guincho',this)">Guincho</button>
<button class="tab" onclick="openTab('clientes',this)">Clientes</button>

</div>

<!-- CLIENTE TOP (NOVO) -->
<div class="client-top">
<input id="clientName" placeholder="Nome">
<input id="clientCode" placeholder="Código">
</div>

<!-- CLIENTES -->
<div id="clientes" class="content active">

<div class="clients-container">

<!-- ESQUERDA -->
<div class="left">

<input class="search" id="search" placeholder="Buscar cliente..." oninput="renderClientes()">

<table>
<thead>
<tr>
<th>Nome</th>
<th>Código</th>
<th>Total</th>
<th>Visitas</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<!-- DIREITA -->
<div class="right">
<h3>🏆 Ranking</h3>
<div id="ranking"></div>
</div>

</div>

</div>

<!-- TOTAL -->
<div class="total-box">

<div id="valorTotal">$0</div>

<div class="buttons">
<button class="copy" onclick="copiarTotal()">Copiar</button>
<button class="reset" onclick="resetar()">Resetar</button>
<button class="reset" onclick="salvarOrcamento()">Salvar</button>
</div>

</div>

<script>

let clients = JSON.parse(localStorage.getItem("clients") || "{}");

function openTab(id,el){
document.querySelectorAll('.content').forEach(e=>e.classList.remove('active'));
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
document.getElementById(id).classList.add('active');
el.classList.add('active');
}

function calcular(){
let total = 0;
document.getElementById("valorTotal").innerText = "$" + total;
}

function salvarOrcamento(){

let name = document.getElementById("clientName").value;
let code = document.getElementById("clientCode").value;

if(!code) return;

let total = Number(document.getElementById("valorTotal").innerText.replace("$","") || 0);

if(!clients[code]){
clients[code] = {name, code, total:0, visits:0};
}

clients[code].name = name;
clients[code].code = code;
clients[code].total += total;
clients[code].visits++;

localStorage.setItem("clients",JSON.stringify(clients));

renderClientes();
}

function renderClientes(){

let search = document.getElementById("search").value?.toLowerCase() || "";

let body = document.getElementById("tableBody");
body.innerHTML = "";

let ranking = Object.values(clients)
.sort((a,b)=>b.total - a.total);

ranking.forEach(c=>{

if(c.name.toLowerCase().includes(search)){

body.innerHTML += `
<tr>
<td>${c.name}</td>
<td>${c.code}</td>
<td>$${c.total}</td>
<td>${c.visits}</td>
</tr>
`;
}
});

let rankDiv = document.getElementById("ranking");
rankDiv.innerHTML = "";

ranking.slice(0,5).forEach((c,i)=>{
rankDiv.innerHTML += `
<div class="rank-item">
${i+1}. ${c.name} - $${c.total}
</div>
`;
});

}

function copiarTotal(){
navigator.clipboard.writeText(document.getElementById("valorTotal").innerText);
}

function resetar(){
document.getElementById("valorTotal").innerText = "$0";
}

renderClientes();

</script>

</body>
</html>
