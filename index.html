<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Repair - Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root {
    --primary: #ff2b2b;
    --primary-glow: rgba(255, 43, 43, 0.3);
    --bg-dark: #0a0a0c;
    --panel-bg: rgba(20, 20, 25, 0.85);
    --panel-border: rgba(255, 255, 255, 0.08);
    --input-bg: #16161c;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: 
        linear-gradient(rgba(10, 10, 12, 0.92), rgba(5, 5, 5, 0.97)),
        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop');
    background-size: cover;
    background-attachment: fixed;
    background-position: center;
    color: var(--text-main);
    font-size: 14px;
    padding-bottom: 150px;
}

/* HEADER */
header {
    padding: 20px;
    text-align: center;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border);
}
header h1 {
    color: var(--text-main);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
}
header h1 span {
    color: var(--primary);
    text-shadow: 0 0 12px var(--primary-glow);
}

/* TABS SYSTEM */
.tabs {
    display: flex;
    justify-content: center;
    background: rgba(15, 15, 20, 0.8);
    backdrop-filter: blur(5px);
    border-bottom: 2px solid #111;
    padding: 5px 10px 0 10px;
    gap: 4px;
    overflow-x: auto;
}
.tab {
    padding: 12px 20px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    border-radius: 6px 6px 0 0;
    transition: all 0.2s ease;
}
.tab:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.03);
}
.tab.active {
    background: var(--primary);
    color: #000;
    font-weight: 700;
    box-shadow: 0 -4px 12px var(--primary-glow);
}

/* CONTAINER PRINCIPAL */
.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 20px;
}

/* CONTENT BLOCKS */
.content {
    display: none;
    animation: fadeIn 0.3s ease-in-out;
}
.content.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

/* GRID DE PRODUTOS/SERVIÇOS CENTRALIZADO */
.items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    justify-content: center;
}

.item {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    padding: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    height: 60px;
}
.item:hover {
    border-color: rgba(255, 43, 43, 0.4);
    background: rgba(255, 43, 43, 0.02);
}

.item.selected {
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(255, 43, 43, 0.15) inset, 0 2px 8px rgba(0,0,0,0.4);
    background: rgba(255, 43, 43, 0.04);
}

.item label {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    width: 100%;
    height: 100%;
    font-weight: 500;
}

.item .price-tag {
    color: var(--primary);
    font-weight: 700;
    margin-left: auto;
}

/* INPUTS CUSTOMIZADOS */
input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid #4b5563;
    border-radius: 4px;
    background: var(--input-bg);
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    flex-shrink: 0;
}
input[type="checkbox"]:checked {
    background: var(--primary);
    border-color: var(--primary);
}
input[type="checkbox"]:checked::after {
    content: "✓";
    position: absolute;
    color: black;
    font-size: 13px;
    font-weight: 900;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

input[type="number"] {
    background: var(--input-bg);
    border: 1px solid #374151;
    color: white;
    padding: 6px;
    text-align: center;
    width: 65px;
    border-radius: 6px;
    font-weight: bold;
}
input[type="number"]:focus {
    border-color: var(--primary);
    outline: none;
}

/* DESIGN SELETOR DE DESCONTO */
.discount-select {
    background: #111115;
    border: 1px solid #27272a;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: border-color 0.2s;
    outline: none;
}
.discount-select:focus {
    border-color: var(--primary);
}

/* CLIENTES TAB DESIGN */
.clients-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}
.panel-left {
    flex: 2;
    min-width: 320px;
}
.panel-right {
    flex: 1;
    min-width: 300px;
}
.panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    padding: 20px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
}
.panel h3 {
    font-size: 16px;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 8px;
}

.search {
    width: 100%;
    margin-bottom: 15px;
    background: var(--input-bg);
    border: 1px solid #27272a;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
}
.search:focus { border-color: var(--primary); outline: none; }

/* RECORDE DE TABELAS */
.table-responsive {
    overflow-x: auto;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #222;
}
th {
    background: rgba(0,0,0,0.3);
    color: var(--primary);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* RANKING */
.rank-item {
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 3px solid #3b82f6;
}
.rank-item:nth-child(1) { border-left-color: #ffd700; background: linear-gradient(90deg, rgba(255,215,0,0.05), transparent); }

/* DOCK BAR INFERIOR */
.dock-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(5, 5, 7, 0.95);
    backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255, 43, 43, 0.4);
    display: flex;
    flex-direction: column;
    z-index: 1000;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
}

.dock-materials {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 8px 24px;
    background: rgba(0, 0, 0, 0.4);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    flex-wrap: wrap;
}
.material-badge {
