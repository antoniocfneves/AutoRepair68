<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto Repair</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:
    linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.95)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    min-height:100vh;
    font-size:14px; /* ↓ menor */
}

/* HEADER */
header{
    background:rgba(0,0,0,0.95);
    padding:15px;
    text-align:center;
    border-bottom:3px solid #ff2b2b;
    box-shadow:0 0 15px #ff2b2b55;
}

header h1{
    font-size:24px;
    color:#ff2b2b;
    text-shadow:0 0 10px #ff2b2b;
}

header p{
    margin-top:5px;
    color:#aaa;
    font-size:12px;
}

/* TABS */
.tabs{
    display:flex;
    overflow-x:auto;
    background:#111;
    border-bottom:2px solid #ff2b2b;
}

.tab{
    flex:none;
    padding:10px 15px; /* ↓ menor */
    background:#111;
    color:white;
    border:none;
    cursor:pointer;
    transition:0.3s;
    font-size:13px;
    font-weight:bold;
}

.tab:hover{
    background:#1d1d1d;
}

.tab.active{
    background:#ff2b2b;
    color:black;
}

/* CONTENT */
.content{
    display:none;
    padding:15px;
    animation:fade 0.3s;
}

.content.active{
    display:block;
}

@keyframes fade{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* ITEM */
.item{
    background:rgba(20,20,20,0.92);
    border:1px solid #333;
    border-left:4px solid #ff2b2b;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.3s;
}

.item:hover{
    transform:scale(1.01);
    border-color:#ff2b2b;
    box-shadow:0 0 10px #ff2b2b44;
}

label{
    font-size:14px;
}

input[type="checkbox"]{
    transform:scale(1.1);
    margin-right:8px;
}

input[type="number"]{
    width:60px;
    padding:6px;
    border:none;
    border-radius:6px;
    background:#222;
    color:white;
    text-align:center;
    font-size:13px;
}

/* TOTAL FIXO EM BAIXO */
.total-box{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#000;
    border-top:2px solid #ff2b2b;
    box-shadow:0 -5px 20px #ff2b2b55;
    padding:10px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.total-box h2{
    color:#ff2b2b;
    font-size:14px;
}

#valorTotal{
    font-size:20px;
    font-weight:bold;
    color:white;
}

/* BOTÕES */
.buttons{
    display:flex;
    gap:8px;
}

.buttons button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.copy{
    background:#777;
    color:white;
}

.reset{
    background:#ff2b2b;
    color:white;
}

.buttons button:hover{
    opacity:0.85;
}

/* MOBILE */
@media(max-width:768px){

    .item{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
    }

    .total-box{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }
}

</style>
</head>

<body>

<header>
    <h1>🚗 AUTO REPAIR</h1>
    <p>Sistema de orçamento automático</p>
</header>

<div class="tabs">

<button class="tab active" onclick="openTab('nitro', this)">Nitro</button>
<button class="tab" onclick="openTab('stage', this)">Stage</button>
<button class="tab" onclick="openTab('reparo', this)">Reparos</button>
<button class="tab" onclick="openTab('lockpick', this)">Lockpick</button>
<button class="tab" onclick="openTab('guincho', this)">Guincho</button>

</div>

<!-- CONTEÚDO (igual ao seu original, sem mudança estrutural) -->
<!-- ... mantenha todas suas sections aqui exatamente iguais ... -->

<div class="total-box">

<h2>TOTAL</h2>
<div id="valorTotal">$0</div>

<div class="buttons">
<button class="copy" onclick="copiarTotal()">Copiar</button>
<button class="reset" onclick="resetar()">Resetar</button>
</div>

</div>

<script>

function openTab(tabId, element){

    document.querySelectorAll('.content')
    .forEach(tab => tab.classList.remove('active'));

    document.querySelectorAll('.tab')
    .forEach(btn => btn.classList.remove('active'));

    document.getElementById(tabId).classList.add('active');
    element.classList.add('active');
}

function calcular(){

    let total = 0;

    document.querySelectorAll('input[type="checkbox"]').forEach(item=>{
        if(item.checked) total += Number(item.value);
    });

    document.querySelectorAll('input[type="number"]').forEach(item=>{
        total += Number(item.value) * Number(item.dataset.price);
    });

    document.getElementById('valorTotal').innerText =
    "$" + total.toLocaleString('pt-BR');
}

function copiarTotal(){
    let valor = document.getElementById('valorTotal').innerText;
    navigator.clipboard.writeText(valor);
    alert("Total copiado: " + valor);
}

function resetar(){

    document.querySelectorAll('input[type="checkbox"]').forEach(i=>i.checked=false);
    document.querySelectorAll('input[type="number"]').forEach(i=>i.value=0);

    calcular();
}

</script>

</body>
</html>
